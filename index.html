<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blob">
<meta name="theme-color" content="#F5EBDD">
<title>Blob</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  :root { --paper:#faf6ef; --ink:#3a3733; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  /* the body is the single viewport container: fixed to the layout viewport's
     top-left, sized to the dynamic viewport (dvh) so it tracks the real visible
     height as browser chrome comes and goes. Canvas and toolbar form one flex
     column: the canvas ends exactly where the toolbar begins. */
  body {
    position:fixed; top:0; left:0; right:0;
    height:100%; height:100dvh; /* fallback for engines without dvh */
    display:flex; flex-direction:column;
    background:var(--paper);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  #canvas { flex:1 1 auto; min-height:0; width:100%; touch-action:none; display:block; }

  /* top-right actions */
  .top-actions {
    position:fixed; top:0; right:0;
    padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 0;
    display:flex; gap:10px;
  }
  .icon-btn {
    width:42px; height:42px; border-radius:50%;
    border:1px solid rgba(0,0,0,.06);
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.10); cursor:pointer; touch-action:manipulation;
  }
  .icon-btn:active { transform:scale(.92); }
  .icon-btn svg { width:20px; height:20px; }

  /* bottom toolbar: circled floating pill, floated by its margins inside the
     column. env(safe-area-inset-bottom) adapts the gap to the mode
     automatically: home-indicator zone in the installed PWA, zero above
     Safari's own toolbar in the browser */
  .toolbar {
    margin:0 12px calc(6px + env(safe-area-inset-bottom));
    padding:12px 14px;
    border-radius:24px;
    background:rgba(255,253,249,.82);
    backdrop-filter:blur(16px) saturate(1.5); -webkit-backdrop-filter:blur(16px) saturate(1.5);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:0 6px 30px rgba(58,55,51,.15);
    display:flex; flex-direction:column; gap:10px;
  }
  .row { display:flex; align-items:center; gap:12px; }
  .tools { display:flex; background:rgba(58,55,51,.08); border-radius:14px; padding:3px; flex:none; }
  .tool {
    width:46px; height:38px; border:none; border-radius:11px; background:transparent;
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:manipulation;
  }
  .tool.active { background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.16); }
  .tool svg { width:19px; height:19px; }

  .size-preview { width:36px; height:36px; flex:none; display:flex; align-items:center; justify-content:center; }
  #sizeDot { border-radius:50%; background:var(--ink); }
  #sizeDot.eraser { background:transparent; border:2px dashed rgba(58,55,51,.55); }

  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; min-width:0; height:38px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:rgba(58,55,51,.15); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
    background:#fff; border:1px solid rgba(0,0,0,.06); box-shadow:0 2px 6px rgba(0,0,0,.3);
    margin-top:-10px;
  }

  .swatches { display:flex; justify-content:space-between; }
  .swatches.dim { opacity:.35; pointer-events:none; }
  .swatch {
    width:37px; height:37px; border-radius:50%;
    border:1px solid rgba(0,0,0,.08); cursor:pointer; touch-action:manipulation;
  }
  .swatch.active { box-shadow:0 0 0 2px rgba(255,255,255,.9), 0 0 0 4px rgba(58,55,51,.55); }
  .swatch:active { transform:scale(.9); }

  /* onboarding bubble: a rounded speech bubble with a small tail underneath.
     The three look options arrive as custom properties (--bubble-*), set per
     instance by createBubble(); the rest of this block is the component's own
     look. The tail paints itself with the very same --bubble-bg, so it can
     never mismatch, and casts the very same shadow as the card. */
  .bubble {
    --shadow:0 6px 30px rgba(58,55,51,.15); /* the toolbar's shadow */
    position:absolute; left:0; right:0; margin:0 auto; /* centred by itself; the parent sets top */
    width:max-content; max-width:85%; /* as wide as the text, never past 85% of the parent */
    padding:12px 18px; border-radius:24px;
    background:var(--bubble-bg); color:var(--bubble-ink);
    font-family:var(--bubble-font); font-size:17px; font-weight:700; line-height:1.3;
    text-align:center; overflow-wrap:break-word;
    white-space:pre-line; /* wraps by itself; a "\n" in the text forces a line break */
    text-wrap:balance; /* where it does wrap, the lines come out even (older iOS: plain wrap) */
    box-shadow:var(--shadow);
    pointer-events:none; /* a hint never steals touches from the canvas under it */
  }
  .bubble::after { /* tail; its top pixel hides under the card so no seam shows */
    content:""; position:absolute; top:calc(100% - 1px); left:50%; margin-left:-9px;
    border:9px solid transparent; border-bottom:0; border-top:12px solid var(--bubble-bg);
    filter:drop-shadow(var(--shadow)); /* a box-shadow would outline the box, not the triangle */
  }

  /* screenshot result overlay */
  .shot-overlay {
    position:fixed; inset:0; z-index:10;
    background:rgba(24,20,16,.6);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .shot-overlay[hidden] { display:none; }
  .shot-card {
    background:#fffdf9; border-radius:20px; padding:14px; width:100%; max-width:320px;
    box-shadow:0 12px 40px rgba(0,0,0,.4);
    display:flex; flex-direction:column; gap:10px;
  }
  #shotImage {
    width:100%; border-radius:12px; display:block; background:#eee;
    -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto;
  }
  .shot-actions { display:flex; gap:8px; }
  .shot-btn {
    flex:1; height:44px; border:none; border-radius:12px; background:var(--ink);
    color:#fffdf9; font-size:15px; font-weight:600; cursor:pointer; touch-action:manipulation;
  }
  .shot-btn.ghost { background:rgba(58,55,51,.1); color:var(--ink); }
  .shot-hint { margin:0; text-align:center; font-size:12px; color:rgba(58,55,51,.6); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="top-actions">
  <button class="icon-btn" id="undoBtn" aria-label="Undo" title="Undo last line">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
    </svg>
  </button>
  <button class="icon-btn" id="newBlobBtn" aria-label="New blob" title="New blob">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
    </svg>
  </button>
  <button class="icon-btn" id="shotBtn" aria-label="Screenshot" title="Screenshot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
      <circle cx="12" cy="13" r="3"/>
    </svg>
  </button>
</div>

<div class="shot-overlay" id="shotOverlay" hidden>
  <div class="shot-card">
    <img id="shotImage" alt="Your doodle">
    <div class="shot-actions">
      <button class="shot-btn" id="shotShareBtn">Save</button>
      <button class="shot-btn ghost" id="shotCloseBtn">Close</button>
    </div>
    <p class="shot-hint">Long-press the image &rarr; &ldquo;Add to Photos&rdquo;</p>
  </div>
</div>

<div class="toolbar">
  <div class="row">
    <div class="tools">
      <button class="tool active" id="brushBtn" aria-label="Brush">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/>
          <path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/>
        </svg>
      </button>
      <button class="tool" id="eraserBtn" aria-label="Eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
          <path d="M22 21H7"/><path d="m5 11 9 9"/>
        </svg>
      </button>
    </div>
    <div class="size-preview"><div id="sizeDot"></div></div>
    <input type="range" id="sizeSlider" min="2" max="80" step="1" value="8" aria-label="Size">
  </div>
  <div class="swatches" id="swatches"></div>
</div>

<script>
// PWA: register the service worker for offline support (relative path works under a subpath)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var W, H;

  // Canvas always fits the real viewport. The CSS column sizes the canvas
  // element; the bitmap is measured from the element's actual box. Whenever
  // the box genuinely changes we re-fit and start fresh.
  function setup() {
    var rect = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function refit() {
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width));
    var h = Math.max(1, Math.round(rect.height));
    if (w !== W || h !== H) {
      setup();
      newBlob();
    }
  }

  // ---------- palettes ----------
  var PALETTES = [
    // Playful Garden
    ['#F4D35E', '#EE964B', '#E76F51', '#7BAE7F', '#3D8C83', '#74B3CE', '#8B78A6', '#594F46'],
    // Candy Universe
    ['#FF6B81', '#F7A8C4', '#F9D65C', '#8DD3C7', '#4CB7C5', '#7986CB', '#A58BD4', '#FFF0DC'],
    // Electric Nature
    ['#F4E04D', '#F29E4C', '#E85D75', '#C06C84', '#6A8D73', '#2A9D8F', '#4381B8', '#343A56'],
    // Midnight Cinema
    ['#18243A', '#344C64', '#527C83', '#8A9B91', '#D5BFA3', '#E6A15C', '#C76B63', '#B6A0C8'],
    // Paper & Ink
    ['#F5EBDD', '#202020', '#E63946', '#F4B942', '#235789', '#70A288', '#A44A3F', '#B8A7C9'],
    // Neon Lagoon
    ['#00A6A6', '#00D1B2', '#B7E000', '#F0E442', '#FF6B35', '#F04B83', '#8B5CF6', '#30306B']
  ];

  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  var currentBg = '#F5EBDD';
  function applyBackground(bg) {
    currentBg = bg;
    document.body.style.background = bg;
    document.documentElement.style.setProperty('--paper', bg);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', bg);
  }

  // ---------- state ----------
  var tool = 'brush';
  var brushColor = '#3a3733';
  var sizes = { brush: 8, eraser: 28 };

  // ---------- DOM refs ----------
  var brushBtn = document.getElementById('brushBtn');
  var eraserBtn = document.getElementById('eraserBtn');
  var slider = document.getElementById('sizeSlider');
  var sizeDot = document.getElementById('sizeDot');
  var swatchesEl = document.getElementById('swatches');
  var newBlobBtn = document.getElementById('newBlobBtn');
  var undoBtn = document.getElementById('undoBtn');
  var shotBtn = document.getElementById('shotBtn');
  var shotOverlay = document.getElementById('shotOverlay');
  var shotImage = document.getElementById('shotImage');

  // ---------- blob ----------
  // Each blob picks a "family" — its own silhouette recipe — so two blobs in a
  // row rarely feel alike: round cloud, stretched pancake/egg, crescent (C) or
  // hook (J). Every family follows the same rules: one solid colour, smooth
  // outlines only (no corners ever), fits the viewport, clear of the top
  // buttons and the toolbar. The classic cloud stays the anchor so the C's
  // and J's feel like discoveries, not a pattern.
  var FAMILIES = [
    { name: 'classic', w: 0.40 },
    { name: 'stretch', w: 0.20 },
    { name: 'crescent', w: 0.20 },
    { name: 'hook', w: 0.20 }
  ];

  function pickFamily() {
    var total = 0, i;
    for (i = 0; i < FAMILIES.length; i++) total += FAMILIES[i].w;
    var roll = Math.random() * total;
    for (i = 0; i < FAMILIES.length; i++) {
      roll -= FAMILIES[i].w;
      if (roll < 0) return FAMILIES[i].name;
    }
    return FAMILIES[0].name;
  }

  // random sine-wave recipe for an outline: k lobes, depth a, phase p
  function harmonicSet(minK, maxK, count, aMin, aSpan) {
    var hs = [];
    for (var i = 0; i < count; i++) {
      hs.push({
        k: minK + Math.floor(Math.random() * (maxK - minK + 1)),
        a: aMin + Math.random() * aSpan,
        p: Math.random() * Math.PI * 2
      });
    }
    return hs;
  }

  // normalized wobbly radius at angle t; the 0.45 floor keeps the shape from
  // ever pinching shut, whatever the harmonics roll
  function radiusAt(hs, t) {
    var r = 1;
    for (var i = 0; i < hs.length; i++) r += hs[i].a * Math.sin(hs[i].k * t + hs[i].p);
    return Math.max(r, 0.45);
  }

  // wobbly disc, stretched by (sx, sy) and rotated by tilt around (cx, cy)
  function wobblyDisc(cx, cy, R, hs, sx, sy, tilt) {
    var cos = Math.cos(tilt), sin = Math.sin(tilt);
    ctx.beginPath();
    var steps = 84; // dense sampling keeps the silhouette round even as straight segments
    for (var s = 0; s <= steps; s++) {
      var t = (s / steps) * Math.PI * 2;
      var r = R * radiusAt(hs, t);
      var x = Math.cos(t) * r * sx, y = Math.sin(t) * r * sy;
      var px = cx + x * cos - y * sin;
      var py = cy + x * sin + y * cos;
      if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  // Hook family: one thick round-ended stroke along a curve — j (curl at the
  // bottom), cane (curl at the top) or snake (two bends) — tilted so hooks
  // lean instead of always standing upright
  function drawHook(cx, cy, R, p) {
    var topY = Math.max(cy - R * 1.05, H * 0.12); // keep clear of the top buttons
    var botY = Math.min(cy + R * 0.72, H * 0.62); // ...and of the toolbar
    var x0 = cx + (Math.random() - 0.5) * R * 0.5;
    var p0, p1, p2, p3 = null;
    if (p.kind === 'snake') {
      // two bends: an S-curve, fat in the middle, tapered at both ends
      p0 = { x: x0, y: topY };
      p1 = { x: x0 + p.dir * R * 0.65, y: topY + (botY - topY) * 0.33 };
      p2 = { x: x0 - p.dir * R * 0.65, y: botY - (botY - topY) * 0.33 };
      p3 = { x: x0 + (Math.random() - 0.5) * R * 0.3, y: botY };
    } else {
      // one bend: j curls at the bottom, cane at the top
      var straightY = p.kind === 'cane' ? botY : topY;
      var bendY = p.kind === 'cane' ? topY : botY;
      var tipDir = p.kind === 'cane' ? 1 : -1; // tip curls back toward the middle
      p0 = { x: x0, y: straightY };
      p1 = { x: x0 + p.dir * R * 0.12, y: bendY };
      p2 = { x: x0 - p.dir * R * p.swing, y: bendY + tipDir * R * p.curl };
    }
    var r0 = R * 0.30, r1 = R * 0.13; // thick at the straight end, tapered curl
    var cosT = Math.cos(p.tilt), sinT = Math.sin(p.tilt);
    var wob = Math.random() * Math.PI * 2;
    var steps = 44; // overlapping discs merge into one smooth organic stroke
    for (var i = 0; i <= steps; i++) {
      var u = i / steps;
      var x, y, r;
      if (p3) {
        var qa = (1 - u) * (1 - u) * (1 - u), qb = 3 * u * (1 - u) * (1 - u),
            qc = 3 * u * u * (1 - u), qd = u * u * u;
        x = qa * p0.x + qb * p1.x + qc * p2.x + qd * p3.x;
        y = qa * p0.y + qb * p1.y + qc * p2.y + qd * p3.y;
        r = R * (0.12 + 0.10 * Math.sin(Math.PI * u)); // fat middle, thin ends
      } else {
        var a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c2 = u * u;
        x = a * p0.x + b * p1.x + c2 * p2.x;
        y = a * p0.y + b * p1.y + c2 * p2.y;
        r = r0 + (r1 - r0) * u;
      }
      r *= 1 + 0.07 * Math.sin(u * Math.PI * 3 + wob); // slow organic thickness drift
      var dx = x - cx, dy = y - cy;
      ctx.beginPath();
      ctx.arc(cx + dx * cosT - dy * sinT, cy + dx * sinT + dy * cosT, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // erase an organic bite out of the blob: a centred bite makes a ring, an
  // edge bite a nibble; a bite reaching past the centre is clamped so it can
  // never eat the whole figure
  function carveBite(cx, cy, R, angle, off, size) {
    var biteR = R * size;
    if (off < size) biteR = Math.min(biteR, R * (1.05 - off));
    ctx.globalCompositeOperation = 'destination-out'; // carve...
    wobblyDisc(cx + Math.cos(angle) * R * off, cy + Math.sin(angle) * R * off,
      biteR, harmonicSet(2, 5, 2, 0.05, 0.09), 1, 1, 0);
    ctx.globalCompositeOperation = 'source-over'; // ...then paint normally again
  }

  // ---------- shape memory ----------
  // remember the last 5 generated shapes; a new one must differ from all of
  // them. "Differ" is checked on a coarse signature — family plus bucketed
  // traits (direction, stretch, bite size, bumpiness) — so near identical
  // cousins are blocked too, not just exact repeats.
  var RECENT_MAX = 5;
  var recentShapes = [];

  function sector(angle) { // 4 buckets around the circle: 0 right, 1 down, 2 left, 3 up
    var a = (angle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(a / (Math.PI / 2));
  }

  function rollShape() {
    var family = pickFamily();
    var s = { family: family };
    if (family === 'stretch') {
      s.sy = 0.75 + Math.random() * 0.60; // height factor; width = 1/height
      s.tilt = (Math.random() - 0.5) * 1.1; // up to ~±32°
      s.hs = harmonicSet(2, 5, 2 + Math.floor(Math.random() * 2), 0.06, 0.12);
      s.sig = 'stretch:' + (s.sy < 0.93 ? 'flat' : s.sy > 1.07 ? 'tall' : 'round') + ':' + sector(s.tilt);
    } else if (family === 'crescent') {
      // sub-species by bite geometry: moon, ring, bigbite, nibble (x2 = two
      // nibbles). Mirrored/rotated variants share a signature, so the memory
      // window blocks same-looking crescents.
      s.hs = harmonicSet(1, 5, 2 + Math.floor(Math.random() * 2), 0.06, 0.14); // lumpy, like the classic cloud
      s.open = Math.random() * Math.PI * 2; // direction the bite sits
      var kinds = ['moon', 'ring', 'bigbite', 'nibble'];
      s.kind = kinds[Math.floor(Math.random() * kinds.length)];
      if (s.kind === 'moon') { s.off = 0.42 + Math.random() * 0.16; s.bite = 0.42 + Math.random() * 0.20; }
      else if (s.kind === 'ring') { s.off = Math.random() * 0.12; s.bite = 0.55 + Math.random() * 0.17; }
      else if (s.kind === 'bigbite') { s.off = 0.30 + Math.random() * 0.15; s.bite = 0.70 + Math.random() * 0.15; }
      else { // nibble: a small bite at the rim, occasionally two
        s.off = 0.80 + Math.random() * 0.15; s.bite = 0.18 + Math.random() * 0.12;
        s.second = Math.random() < 0.35;
      }
      s.sig = 'crescent:' + s.kind + (s.second ? ':x2' : '');
    } else if (family === 'hook') {
      // sub-species by bend structure: j, cane (curl at the top), snake (S)
      s.kind = ['j', 'cane', 'snake'][Math.floor(Math.random() * 3)];
      s.dir = Math.random() < 0.5 ? 1 : -1; // curls left or right
      s.swing = 0.55 + Math.random() * 0.45; // how far the hook swings out
      s.curl = 0.30 + Math.random() * 0.25;  // how much it curls back
      s.tilt = (Math.random() - 0.5) * 1.22; // lean up to ~±35°
      s.sig = 'hook:' + s.kind; // direction-independent: a mirror is the same shape
    } else {
      s.hs = harmonicSet(1, 5, 2 + Math.floor(Math.random() * 2), 0.07, 0.21);
      var bump = 0, deep = 0;
      for (var i = 0; i < s.hs.length; i++) { bump += s.hs[i].k; deep = Math.max(deep, s.hs[i].a); }
      s.sig = 'classic:' + (bump <= 4 ? 'calm' : bump <= 7 ? 'bumpy' : 'wild') + ':' +
        (deep < 0.15 ? 'soft' : 'deep');
    }
    return s;
  }

  // re-roll until the shape is fresh for the memory window; switching family
  // from the previous blob is preferred (first 8 attempts), then relaxed
  function pickShape() {
    var last = recentShapes[recentShapes.length - 1] || '';
    for (var attempt = 0; attempt < 14; attempt++) {
      var s = rollShape();
      if (recentShapes.indexOf(s.sig) !== -1) continue; // too close to a recent shape
      if (attempt < 8 && last.indexOf(s.family + ':') === 0) continue; // prefer a family switch
      return s;
    }
    return rollShape(); // extremely unlikely: signature space is much larger than 5
  }

  function newBlob() {
    // the eraser may have left destination-out active; always paint normally here
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
    undoStack.length = 0; // fresh scene, nothing to undo into

    // one random palette: one colour for the blob, one for the paper, the rest
    // to draw with — the blob's own colour stays in the swatch set
    var palette = pick(PALETTES).slice();
    var blobIndex = Math.floor(Math.random() * palette.length);
    var bgIndex = Math.floor(Math.random() * (palette.length - 1)); // any other slot
    if (bgIndex >= blobIndex) bgIndex++;
    var blobColor = palette[blobIndex];
    var bgColor = palette.splice(bgIndex, 1)[0]; // leaves the paper colour out of the swatches only
    applyBackground(bgColor);

    // anchor point shared by every family: centred, slightly above centre
    var cx = W / 2;
    var cy = H * 0.44;
    var R = Math.min(W, H) * (0.20 + Math.random() * 0.09);
    ctx.fillStyle = blobColor;

    var shape = pickShape();
    var family = shape.family;
    var hs = shape.hs, sx = 1, sy = 1, tilt = 0;

    if (family === 'stretch') {
      sy = shape.sy;
      sx = 1 / sy; // area stays roughly constant
      tilt = shape.tilt;
      R = R / (0.6 + 0.4 * Math.max(sx, sy)); // tall/flat blobs shrink so they still fit
      wobblyDisc(cx, cy, R, hs, sx, sy, tilt);
    } else if (family === 'crescent') {
      // disc minus bite(s): moon, ring, wide-open C or a nibbled cookie.
      // the bite can only touch the blob — the canvas holds nothing else
      wobblyDisc(cx, cy, R, hs, 1, 1, 0);
      carveBite(cx, cy, R, shape.open, shape.off, shape.bite);
      if (shape.second) {
        carveBite(cx, cy, R, shape.open + 1.0 + Math.random() * 1.2,
          0.80 + Math.random() * 0.15, 0.15 + Math.random() * 0.13);
      }
    } else if (family === 'hook') {
      R = Math.min(R, H * 0.19); // leave room for the tilt to stay clear of the toolbar
      drawHook(cx, cy, R, shape);
    } else {
      // classic cloud: lobes 1-5 (a 1-lobe wobble makes eggs and pears)
      wobblyDisc(cx, cy, R, hs, 1, 1, 0);
    }

    // cloud lumps hugging the edge, same colour so they melt into the figure
    // (radial families only: crescents and hooks already have their own character)
    if (family === 'classic' || family === 'stretch') {
      var lumps = Math.floor(Math.random() * 4); // 0-3
      var cosT = Math.cos(tilt), sinT = Math.sin(tilt);
      for (var l = 0; l < lumps; l++) {
        var la = Math.random() * Math.PI * 2;
        var lr = radiusAt(hs, la) * (0.80 + Math.random() * 0.18);
        var lx = Math.cos(la) * lr * R * sx, ly = Math.sin(la) * lr * R * sy;
        ctx.beginPath();
        ctx.arc(cx + lx * cosT - ly * sinT, cy + lx * sinT + ly * cosT,
          R * (0.16 + Math.random() * 0.22) * (sx + sy) / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // occasional small detached puff, like a cloud shedding one
    if (Math.random() < 0.3) {
      var sa = Math.random() * Math.PI * 2;
      var sd = R * (1.25 + Math.random() * 0.35);
      var px = Math.min(Math.max(cx + Math.cos(sa) * sd, 30), W - 30);
      var py = Math.min(Math.max(cy + Math.sin(sa) * sd, 90), H - 270);
      ctx.beginPath();
      ctx.arc(px, py, R * (0.10 + Math.random() * 0.10), 0, Math.PI * 2);
      ctx.fill();
    }

    recentShapes.push(shape.sig); // remember: the next 5 shapes must differ from this one
    if (recentShapes.length > RECENT_MAX) recentShapes.shift();

    buildSwatches(palette);
    updateLimitY(); // toolbar geometry follows the viewport
  }

  // ---------- swatches ----------
  function buildSwatches(colors) {
    swatchesEl.innerHTML = '';
    colors.forEach(function (color, i) {
      var b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = color;
      b.setAttribute('aria-label', 'Colour ' + color);
      b.addEventListener('click', function () { selectColor(color, b); });
      swatchesEl.appendChild(b);
      if (i === 0) selectColor(color, b); // default: first colour of the set
    });
  }

  function selectColor(color, btn) {
    brushColor = color;
    Array.prototype.forEach.call(swatchesEl.children, function (el) {
      el.classList.toggle('active', el === btn);
    });
    updateSizeDot();
  }

  // ---------- drawing ----------
  var drawing = false;
  var activePointerId = null;
  var last, prevMid;

  function currentSize() { return sizes[tool]; }

  // the canvas ends at the toolbar: strokes cannot go below its top edge.
  // In the flex column the canvas bottom IS the toolbar top, so the canvas
  // height itself is the limit.
  var limitY = Infinity;
  function updateLimitY() {
    limitY = H;
  }

  // keep the brush fully on the canvas: when the finger leaves the edge,
  // the stroke hugs the edge at full thickness instead of fading off-screen
  function clampPoint(p) {
    var r = currentSize() / 2;
    return {
      x: Math.max(r, Math.min(p.x, W - r)),
      y: Math.max(r, Math.min(p.y, limitY - r))
    };
  }

  // ---------- undo (cancel last line) ----------
  var undoStack = [];
  var UNDO_MAX = 15;

  function pushUndo() {
    undoStack.push(canvas.toDataURL());
    if (undoStack.length > UNDO_MAX) undoStack.shift();
  }

  function undoLast() {
    if (drawing || !undoStack.length) return;
    var url = undoStack.pop();
    var img = new Image();
    img.onload = function () {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(img, 0, 0, W, H);
    };
    img.src = url;
  }

  function applyTool() {
    ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.globalAlpha = 1; // brush is fully opaque: covers everything, even black
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = currentSize();
    ctx.strokeStyle = tool === 'eraser' ? '#000' : brushColor;
    ctx.fillStyle = ctx.strokeStyle;
  }

  function dot(p) {
    applyTool();
    ctx.beginPath();
    ctx.arc(p.x, p.y, currentSize() / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function segment(from, to) {
    var mid = { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 };
    applyTool();
    ctx.beginPath();
    ctx.moveTo(prevMid.x, prevMid.y);
    ctx.quadraticCurveTo(from.x, from.y, mid.x, mid.y);
    ctx.stroke();
    prevMid = mid;
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (activePointerId !== null) return; // ignore extra fingers
    activePointerId = e.pointerId;
    drawing = true;
    dismissOnboarding(); // the first stroke, with any tool, ends the onboarding for good
    pushUndo(); // snapshot before the stroke, so Undo cancels the whole line
    last = clampPoint({ x: e.clientX, y: e.clientY });
    prevMid = last;
    dot(last);
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drawing || e.pointerId !== activePointerId) return;
    var p = clampPoint({ x: e.clientX, y: e.clientY });
    segment(last, p);
    last = p;
  });
  function endStroke(e) {
    if (e.pointerId !== activePointerId) return;
    drawing = false;
    activePointerId = null;
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  window.addEventListener('pointerup', endStroke);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // block iOS pinch-zoom on the page
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  // ---------- controls ----------
  function updateSizeDot() {
    var d = Math.max(6, Math.min(currentSize(), 28));
    sizeDot.style.width = d + 'px';
    sizeDot.style.height = d + 'px';
    if (tool === 'eraser') sizeDot.classList.add('eraser');
    else sizeDot.classList.remove('eraser');
    if (tool !== 'eraser') sizeDot.style.background = brushColor;
    else sizeDot.style.background = 'transparent';
  }

  function setTool(t) {
    tool = t;
    brushBtn.classList.toggle('active', t === 'brush');
    eraserBtn.classList.toggle('active', t === 'eraser');
    slider.value = sizes[t];
    swatchesEl.classList.toggle('dim', t === 'eraser');
    updateSizeDot();
  }

  brushBtn.addEventListener('click', function () { setTool('brush'); });
  eraserBtn.addEventListener('click', function () { setTool('eraser'); });

  slider.addEventListener('input', function () {
    sizes[tool] = parseInt(slider.value, 10);
    updateSizeDot();
  });

  newBlobBtn.addEventListener('click', newBlob);
  undoBtn.addEventListener('click', undoLast);
  // ---------- screenshot ----------
  // The canvas holds only the artwork (UI is separate DOM), so composing it over
  // the current background colour gives the finished picture with no toolbar.
  var lastShotBlob = null;

  function makeShot() {
    // picture is cropped at the toolbar: that strip is the canvas edge, not part of the artwork
    var out = document.createElement('canvas');
    out.width = canvas.width;
    out.height = Math.max(1, Math.round(limitY * dpr));
    var octx = out.getContext('2d');
    octx.fillStyle = currentBg;
    octx.fillRect(0, 0, out.width, out.height);
    octx.drawImage(canvas, 0, 0); // anything below the crop simply falls outside
    out.toBlob(function (blob) {
      lastShotBlob = blob;
      shotImage.src = URL.createObjectURL(blob);
      shotOverlay.hidden = false;
    }, 'image/png');
  }

  function closeShot() {
    shotOverlay.hidden = true;
    if (shotImage.src) {
      URL.revokeObjectURL(shotImage.src);
      shotImage.removeAttribute('src');
    }
  }

  shotBtn.addEventListener('click', makeShot);
  document.getElementById('shotCloseBtn').addEventListener('click', closeShot);
  shotOverlay.addEventListener('click', function (e) {
    if (e.target === shotOverlay) closeShot();
  });
  document.getElementById('shotShareBtn').addEventListener('click', function () {
    if (!lastShotBlob) return;
    var file = new File([lastShotBlob], 'blob.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(function () {});
    } else {
      // desktop fallback: plain download
      var a = document.createElement('a');
      a.href = shotImage.src;
      a.download = 'blob.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  });

  // ---------- onboarding bubble ----------
  // Reusable speech bubble: a rounded card with a small tail underneath that
  // points at whatever sits below it. The four options are the only outside
  // knobs; the three look options are stored as CSS custom properties that the
  // stylesheet reads back — the tail through the very same --bubble-bg, so
  // changing the bubble colour moves the tail with it. Returns the element,
  // centred horizontally and otherwise unpositioned: where it goes (style.top,
  // appendChild) is the caller's decision.
  var BUBBLE_DEFAULTS = {
    text: 'Нарисуй, что ты видишь\nв этом пятне', // the \n is the line break after "видишь"
    fontFamily: 'Nunito, sans-serif', // falls back to the system font where Nunito is not installed
    textColor: '#292929',
    backgroundColor: '#FFF8ED'
  };

  function createBubble(options) {
    var o = options || {};
    var el = document.createElement('div');
    el.className = 'bubble';
    el.textContent = o.text || BUBBLE_DEFAULTS.text;
    el.style.setProperty('--bubble-font', o.fontFamily || BUBBLE_DEFAULTS.fontFamily);
    el.style.setProperty('--bubble-ink', o.textColor || BUBBLE_DEFAULTS.textColor);
    el.style.setProperty('--bubble-bg', o.backgroundColor || BUBBLE_DEFAULTS.backgroundColor);
    return el;
  }

  // ---------- onboarding ----------
  // One bubble, on the first open of the app on this device — and never again
  // once the first stroke starts. It is not tied to newBlob(): a new blob
  // never brings it back (while unseen, it simply stays until that stroke).
  // "First time" needs no cookies: localStorage is a small notepad the browser
  // keeps for this site on the device, and nothing in it is ever sent out.
  var ONBOARDING_KEY = 'blob.onboardingSeen';
  var onboardingBubble = null; // exists only while the bubble is on screen

  function onboardingSeen() {
    try { return !!localStorage.getItem(ONBOARDING_KEY); }
    catch (err) { return false; } // storage refused (private mode): treat as a first time
  }

  function showOnboarding() {
    onboardingBubble = createBubble();
    onboardingBubble.lang = 'ru'; // the text is Russian; the page itself is English
    onboardingBubble.style.top = 'calc(62px + env(safe-area-inset-top))'; // the slot under the top buttons
    document.body.appendChild(onboardingBubble);
  }

  function dismissOnboarding() {
    if (!onboardingBubble) return;
    document.body.removeChild(onboardingBubble);
    onboardingBubble = null;
    try { localStorage.setItem(ONBOARDING_KEY, '1'); } // remembered only now: leaving without drawing is still "not seen"
    catch (err) {} // cannot remember it: the bubble will simply show again next time
  }

  // ---------- go ----------
  setup();
  newBlob();
  if (!onboardingSeen()) showOnboarding(); // first open on this device
  var resizeTimer = null;
  function refitSoon() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(refit, 150); // settle first, then re-fit once
  }
  if (window.ResizeObserver) {
    // fires whenever the canvas box truly changes — dvh updates, toolbar
    // collapse, rotation — including the iOS launch transient that window
    // resize events miss in standalone mode
    new ResizeObserver(refitSoon).observe(canvas);
  } else {
    window.addEventListener('resize', refitSoon);
  }
  window.addEventListener('load', refit);
})();
</script>
</body>
</html>
